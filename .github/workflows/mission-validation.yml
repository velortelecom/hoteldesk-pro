name: Mission Validation

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Setup npm
        run: npm i -g npm@11.13.0

      - name: Print runtime versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Validate app (tests + build)
        run: npm run validate:app

  backend-health:
    name: Backend Health Checks
    runs-on: ubuntu-latest
    needs: app-validation
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Setup npm
        run: npm i -g npm@11.13.0

      - name: Print runtime versions
        run: node -v && npm -v

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_PUBLISHABLE_KEY != '' && env.SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1

      - name: Install dependencies
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_PUBLISHABLE_KEY != '' && env.SUPABASE_DB_URL != '' }}
        run: npm ci

      - name: Validate non-mutating mission checks
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_PUBLISHABLE_KEY != '' && env.SUPABASE_DB_URL != '' }}
        run: npm run validate:mission:ci

      - name: Validate DB invariants
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_PUBLISHABLE_KEY != '' && env.SUPABASE_DB_URL != '' }}
        run: supabase db query --db-url "$SUPABASE_DB_URL" --file "scripts/sql/qa_runtime_health.sql"

      - name: Backend checks skipped (missing secrets)
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_PUBLISHABLE_KEY == '' || env.SUPABASE_DB_URL == '' }}
        run: echo "Skipping backend checks because required secrets are missing."
