name: Mission Validation

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate app (tests + build)
        run: npm run validate:app

  backend-health:
    name: Backend Health Checks
    runs-on: ubuntu-latest
    needs: app-validation
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Install dependencies
        run: npm ci

      - name: Validate non-mutating mission checks
        run: npm run validate:mission:ci

      - name: Validate DB invariants
        run: supabase db query --db-url "$SUPABASE_DB_URL" --file "scripts/sql/qa_runtime_health.sql"
